name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quick-check:
    name: Quick Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-backend/package-lock.json

      - name: Run quick CI gate
        run: ./scripts/ci-quick-check.sh
